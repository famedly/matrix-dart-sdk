# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
          	/opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      - name: Resolve dependencies
        run: dart pub get --no-example
        shell: nix develop .#standards --command bash -e {0}
      - name: Check that the lockfile is up to date
        run: |
          # A library leaves its lockfile untracked on purpose: it
          # resolves against whatever the application above it picks.
          if git check-ignore -q pubspec.lock; then
            exit 0
          fi

          # An application that never committed its lockfile leaves
          # nothing for the comparison below to differ from, and
          # resolution just wrote one either way.
          if ! git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo '::error::pubspec.lock is not committed — run `dart pub get` and commit it.'
            exit 1
          fi

          if ! git diff --quiet -- pubspec.lock; then
            git diff -- pubspec.lock

            echo '::error::pubspec.lock is out of date — run `dart pub get` and commit it.'
            exit 1
          fi
      - name: Analyze
        run: dart analyze
        shell: nix develop .#standards --command bash -e {0}
      - name: Lint
        run: dart run dart_code_linter:metrics analyze lib --reporter=github
        shell: nix develop .#standards --command bash -e {0}
      - name: Check for unused files
        run: dart run dart_code_linter:metrics check-unused-files lib --exclude='{**/generated/**.dart,**.g.dart,**.freezed.dart,example/**,lib/matrix_api_lite/generated/**}'
        shell: nix develop .#standards --command bash -e {0}
      - name: Check for unused code
        run: dart run dart_code_linter:metrics check-unused-code lib --exclude='{**/generated/**.dart,**.g.dart,**.freezed.dart,example/**,lib/matrix_api_lite/generated/**}'
        shell: nix develop .#standards --command bash -e {0}
    timeout-minutes: 30
name: Dart checks
"on":
  merge_group: {}
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
