# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
          	/opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      - env:
          PREK_COLOR: always
          TREEFMT_NO_CACHE: "1"
        name: Run pre-commit hooks
        run: prek --all-files --show-diff-on-failure --stage pre-push
        shell: nix develop .#standards --command bash -e {0}
    timeout-minutes: 30
name: Make sure all pre-commit hooks pass
"on":
  merge_group: {}
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
